services:
  # Express Backend Web Service
  - type: web
    name: reachinbox-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_EMAIL_DELAY_MS
        value: "2000"
      - key: DEFAULT_HOURLY_LIMIT
        value: "200"
      - key: JWT_SECRET
        generateValue: true

  # Next.js Frontend Dashboard Web Service
  - type: web
    name: reachinbox-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: url
          postfix: /api

  # Persistent Redis Instance for BullMQ Queues
  - type: redis
    name: reachinbox-redis
    ipAllowList: [] # Internal network access only
    plan: free
